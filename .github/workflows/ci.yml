name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job only needs to read the repository.
permissions:
  contents: read

# Superseded runs on the same ref are cancelled — fast feedback, no wasted
# runner minutes on a repo that receives rapid successive pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows-lint:
    name: Workflows lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint (with shellcheck integration)
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash -o /tmp/download-actionlint.bash
          bash /tmp/download-actionlint.bash
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Lint workflow files (YAML, expressions, context availability)
        run: actionlint -color

      - name: Job summary
        run: |
          {
            echo "### Workflows lint"
            echo "actionlint validated .github/workflows/*.yml: YAML syntax, expression contexts, shellcheck of run blocks."
            echo "This job exists because an invalid expression (secrets context in a job-level if) silently disabled CI — see ADR-012."
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: "Lint (quality gate: Pint + bash + docs parity)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, curl, zip, fileinfo, iconv
          coverage: none

      - name: Bootstrap via the run suite
        run: ./run setup --ci

      - name: Ensure shellcheck is present
        run: command -v shellcheck || (sudo apt-get update -y && sudo apt-get install -y shellcheck)

      - name: Quality gate (Pint + bash -n + shellcheck + docs parity)
        run: ./run quality

  scripts-lint:
    name: Scripts lint (bash -n + shellcheck, no PHP needed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck is present
        run: command -v shellcheck || (sudo apt-get update -y && sudo apt-get install -y shellcheck)

      - name: bash syntax check (dispatcher + library + scripts)
        run: |
          bash -n run
          bash -n scripts/_lib/common.sh
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: shellcheck — warnings must be zero
        run: shellcheck --severity=warning -x run scripts/_lib/common.sh scripts/*.sh

      - name: Dispatcher smoke (help=0, doctor=0-or-1, unknown command=2)
        run: |
          ./run help
          # doctor may legitimately report an unsuitable runner (exit 1),
          # but it must never crash with any other exit code:
          rc=0; ./run doctor || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]
          rc=0; ./run definitely-not-a-command >/dev/null 2>&1 || rc=$?
          [ "$rc" -eq 2 ]

  unit:
    # PHP 8.3 was dropped: the locked dependency graph (Laravel 13.30 /
    # symfony 8.1) requires PHP >= 8.4.1. PHP 8.5 is exercised by the
    # arch-smoke job below (Arch currently ships PHP 8.5.10).
    name: Unit tests (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, curl, zip, fileinfo, iconv
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-8.4-

      - name: Bootstrap via the run suite
        run: ./run setup --ci

      - name: Run unit tests
        run: ./run test unit

  integration:
    # PHP 8.3 dropped (lock requires >= 8.4.1); PHP 8.5 covered by arch-smoke.
    name: Integration tests (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, curl, zip, fileinfo, iconv
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-8.4-

      - name: Bootstrap via the run suite
        run: ./run setup --ci

      - name: Run feature tests
        run: ./run test feature

  e2e:
    name: E2E tests (full journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, curl, zip, fileinfo, iconv
          coverage: none

      - name: Bootstrap via the run suite
        run: ./run setup --ci

      - name: Run E2E tests
        run: ./run test e2e

  http-e2e:
    name: Real-HTTP E2E (serve + curl, via ./run e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, curl, zip, fileinfo, iconv
          coverage: none

      - name: Bootstrap via the run suite
        run: ./run setup --ci

      - name: Run the real-HTTP end-to-end suite
        run: ./run e2e

  arch-smoke:
    name: Arch Linux smoke (real archlinux:base container)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: archlinux:base
    env:
      HOME: /root
    steps:
      - name: Install base toolchain (git + php + php-sqlite + composer; no node needed)
        # php-sqlite is REQUIRED: current Arch splits the pdo_sqlite/sqlite3
        # extensions out of the main php package into php-sqlite (verified
        # against extra/php 8.5.10-1 and extra/php-sqlite 8.5.10-1).
        run: pacman -Syu --noconfirm archlinux-keyring git php php-sqlite composer

      - name: Clone without JS actions (keeps this job node-free)
        run: |
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Enable required PHP extensions (the exact remediation ./run doctor prints)
        # '/pattern/s/^;//' needs no backreference — immune to the double-prefix
        # and printf-%b escaping bugs that produced 'extension=extension=X' lines
        # (which made PHP abort ini parsing and silently drop extension=zip).
        run: |
          sed -ri '/^;(extension=(ctype|curl|dom|fileinfo|iconv|libxml|mbstring|openssl|pdo_sqlite|session|sqlite3|tokenizer|xml|xmlwriter|zip))$/s/^;//' /etc/php/php.ini

      - name: PHP diagnostics (always visible — modules, ini, load warnings)
        run: |
          php -v
          php --ini
          php -m 2>&1 | sort

      - name: Setup (CI mode) through the run suite
        run: ./run setup --ci

      - name: Doctor must be fully green after the documented remediation + setup
        run: ./run doctor

      - name: Quality gate (Pint + bash syntax + docs parity)
        run: |
          pacman -S --noconfirm shellcheck || true
          ./run quality

      - name: Full test pyramid on Arch
        run: ./run test

  hermetic-smoke:
    name: Hermetic toolchain smoke (container with NO PHP)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ubuntu:24.04
    env:
      HOME: /root
    steps:
      - name: Install bare minimum (git, curl — deliberately NO PHP, NO node)
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends git curl ca-certificates

      - name: Clone without JS actions (no node in this container)
        run: |
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prove there is no PHP on this machine
        run: '! command -v php'

      - name: Provision the hermetic toolchain into .tools/
        run: ./run toolchain

      - name: Full setup with the static PHP
        run: ./run setup

      - name: Doctor must be green purely via the hermetic toolchain (after setup)
        run: ./run doctor

      - name: Unit tests on the static PHP
        run: ./run test unit

      - name: Real-HTTP e2e on the static PHP
        run: ./run e2e

  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  llm-gate:
    name: Live-LLM gate (skip detection)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # secrets context IS allowed in job-level env (unlike job-level if —
      # see ADR-012; that distinction silently killed this workflow before).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Detect whether the Gemini key is configured
        id: gate
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GEMINI_API_KEY secret is not configured — live-LLM smoke will be skipped by design (free-tier friendly)."
          fi

  live-llm-smoke:
    name: Optional live-LLM smoke (Gemini flash)
    # needs context IS allowed in job-level if; this is the canonical gate
    # pattern (ADR-012). Runs only when the repo owner configures the
    # GEMINI_API_KEY secret — never blocks CI otherwise.
    needs: llm-gate
    if: needs.llm-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, curl, zip, fileinfo, iconv
          coverage: none

      - name: Bootstrap via the run suite
        run: ./run setup --ci

      - name: Provide the Gemini key
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      - name: Run the live NL-query smoke test (single light call)
        # No --live-llm flag: the live test is gated by the RUN_LIVE_LLM_TESTS
        # env var + GEMINI_API_KEY (see scripts/test.sh header and
        # NlQueryApiTest); artisan test rejects unknown options.
        run: ./run test feature --filter=NlQueryApiTest
        env:
          RUN_LIVE_LLM_TESTS: '1'
